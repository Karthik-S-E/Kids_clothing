<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="dynamic-favicon" rel="icon" type="image/png" href="/logo.png" />
    <script>
      (() => {
        const img = new Image();
        img.src = '/logo.png';
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 64;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          // Clip into a perfect circle
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          // Draw the image inside the circular mask
          ctx.drawImage(img, 0, 0, size, size);

          // Update the tab icon dynamically
          const link = document.getElementById('dynamic-favicon');
          if (link) {
            link.href = canvas.toDataURL('image/png');
          }
        };
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kandamma Kids — premium Indian children's clothing. Festive ethnic wear for boys and girls, ordered via WhatsApp."
    />
    <title>Kandamma Kids · Premium Children's Clothing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
